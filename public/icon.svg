<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0891b2" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#030712"/>
  <circle cx="256" cy="256" r="220" fill="url(#neonGlow)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0891b2" stroke-width="4" stroke-dasharray="24 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="100 20 40 20" opacity="0.8"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Center Nova Core -->
  <circle cx="256" cy="256" r="85" fill="url(#coreGrad)" filter="url(#glow)"/>
  <polygon points="256,190 275,235 322,256 275,277 256,322 237,277 190,256 237,235" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="18" fill="#ffffff"/>
  
  <!-- Orbital Nodes -->
  <circle cx="256" cy="76" r="8" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="436" cy="256" r="8" fill="#6366f1" filter="url(#glow)"/>
  <circle cx="256" cy="436" r="8" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="76" cy="256" r="8" fill="#6366f1" filter="url(#glow)"/>
</svg>
